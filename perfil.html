<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            display: flex;
            background-color: #ffffff;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            border: 1px solid #ccc;
        }

        .barra-lateral {
            width: 250px;
            border-right: 1px solid #eaeaea;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .barra-lateral h3 {
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .separador {
            border: none;
            border-top: 1px solid #eaeaea;
            margin: 15px 0;
        }

        .barra-lateral ul {
            list-style: none;
        }

        .barra-lateral li {
            margin-bottom: 20px;
        }

        .barra-lateral a {
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .contenido-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .cabecera {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eaeaea;
            gap: 10px;
        }

        .titulo-cabecera {
            margin-right: auto;
            font-size: 16px;
            font-weight: bold;
        }

        .btn {
            padding: 5px 15px;
            border: 1px solid #000;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
        }

        .seccion-contenido {
            padding: 40px;
            flex: 1;
            overflow-y: auto;
        }

        .contenedor-formulario {
            width: 100%;
            max-width: 800px;
        }

        .contenedor-formulario h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 5px;
        }

        .linea-titulo {
            border: none;
            border-top: 2px solid #ccc;
            width: 40px;
            margin-bottom: 40px;
        }

        .fila-formulario {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grupo-input {
            flex: 1;
        }

        .grupo-input-completo {
            width: 100%;
            margin-bottom: 20px;
        }

        .grupo-input label, .grupo-input-completo label {
            display: block;
            font-size: 10px;
            color: #000;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .grupo-input input, .grupo-input-completo textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #eaeaea;
            outline: none;
            font-size: 14px;
            color: #333;
        }

        .grupo-input-completo textarea {
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        .btn-submit {
            padding: 12px 30px;
            background-color: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .pie-pagina {
            padding: 15px;
            text-align: center;
            border-top: 1px solid #eaeaea;
            font-size: 10px;
            letter-spacing: 1px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        
        <aside class="barra-lateral">
            <h3>NAVEGACIÓN</h3>
            <hr class="separador">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="pedidos.html">Mis Pedidos</a></li>
                <li><a href="admin.html">Administrador</a></li>
            </ul>
            <hr class="separador">
            <ul>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </aside>

        <main class="contenido-principal">
            
            <header class="cabecera">
                <div class="titulo-cabecera">PERFIL DE USUARIO</div>
                <button class="btn" onclick="window.location.href='perfil.html'">Perfil</button>
                <button class="btn" onclick="window.location.href='login.html'">Cerrar Sesión</button>
            </header>

            <section class="seccion-contenido">
                <div class="contenedor-formulario">
                    <h1>PERFIL DE USUARIO</h1>
                    <hr class="linea-titulo">
                    
                    <form action="perfil.html">
                        
                        <div class="fila-formulario">
                            <div class="grupo-input">
                                <label>NOMBRE COMPLETO</label>
                                <input type="text" value="angel beltran" required>
                            </div>
                            <div class="grupo-input">
                                <label>CORREO ELECTRÓNICO</label>
                                <input type="email" value="angel.beltran@gmail.com" required>
                            </div>
                        </div>

                        <div class="fila-formulario">
                            <div class="grupo-input">
                                <label>NÚMERO DE TELÉFONO</label>
                                <input type="tel" value="+6421231312" required>
                            </div>
                            <div class="grupo-input" style="visibility: hidden;">
                            </div>
                        </div>

                        <div class="grupo-input-completo">
                            <label>DIRECCIÓN DE ENVÍO</label>
                            <textarea rows="4" required>Calle tesopaco, Colonia villa california, obregon, cajeme</textarea>
                        </div>

                        <button type="submit" class="btn-submit">GUARDAR CAMBIOS</button>

                    </form>
                </div>
            </section>

            <footer class="pie-pagina">
                <p>APLICACIONES WEB – UNIDAD 2</p>
            </footer>

        </main>

    </div>

</body>
</html>
